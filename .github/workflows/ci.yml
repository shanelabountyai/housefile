name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Ephemeral runner-local Postgres, gone when the job ends.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/housefile_test?connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/housefile_test?connection_limit=10&pool_timeout=20
      AUTH_SECRET: ci-only-secret-not-for-real-use-0123456789abc
      APP_URL: http://localhost:5900
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          TZ: America/Chicago # a non-UTC server zone, like the laptop's, so the db timezone test can go red here
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: createdb housefile_test
      - run: npx prisma migrate deploy
      - run: npx vitest run
      # Phase 2 proof (task 2.10): seed → preview → commit → undo for both files, a merge and its unmerge; every hash printed.
      - run: npm run phase2:proof
        if: ${{ !cancelled() }}
      # Phase 3 proof (task 3.11): seed with Phase 3 data → roll-ups and segments == answers.json → commit A → letters →
      # correct a gift A wrote → exactly its letter stale → undo A → stateHash == beforeHash; every number and hash printed.
      - run: npm run phase3:proof
        if: ${{ !cancelled() }}
      # Production build, served — the way it ships. Every spec in e2e/, the Phase 3 pages (imports-review, crm-pages) included.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  # Phase 1 gate (task 1.12): no database. Each step exits non-zero on its own failure.
  phase1-gate:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago # non-UTC, so a date that leans on the runner's zone goes red here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run fixtures:check
        if: ${{ !cancelled() }} # every gate reports, not just the first red
      - run: npm run model:lint
        if: ${{ !cancelled() }}
      - run: npm run money:lint
        if: ${{ !cancelled() }}
      - run: npm run write:lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck:phase1
        if: ${{ !cancelled() }}
      - run: npm run test:phase1
        if: ${{ !cancelled() }}
      - run: npm run import:eval
        if: ${{ !cancelled() }}
      # Phase 4 (task 4.8): the P4-4 verdict re-scored from the committed run files. No key here; it calls nothing.
      - run: npm run assist:eval
        if: ${{ !cancelled() }}

  # Spec §4 / §13.3: both modules deleted by the manifest, and the tree must still generate, typecheck, build and pass drift.
  modules-removed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run foundation:check-modules
